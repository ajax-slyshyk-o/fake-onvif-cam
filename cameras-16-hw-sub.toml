[defaults]
advertise_host = "10.42.0.44"
ffmpeg = "d:/bin/ffmpeg-8.1-full_build/bin/ffmpeg.exe"
# Fallback media file. A camera can override this with its own file entry.
file = "d:/Projects/AJAX/video/Kyiv1080.mp4"
width = 1920
height = 1080
fps = 30
scale = false
manufacturer = "Codex Labs"
model = "FakeCam Rust"
overlay_font_size = 32
bitrate = 4000
# Encoder: cameras 01-08 override this with h264_nvenc (GPU); 09-16 use
# light software x264.
codec = "libx264"
preset = "ultrafast"

# Sub stream for every camera: /live_sub, 426x240, 512k, software x264, RTP port = rtp_port + 1000.
# The NVR can use it for live grids instead of decoding the 1080p main stream.
sub_stream = true

[[cameras]]
name = "Fake Camera 01"
uuid = "00000000-0000-4550-98a8-98a80cab1b88"
http = "0.0.0.0:8000"
rtsp_port = 8554
rtsp_path = "live"
rtp_port = 5004
serial = "FAKE-ONVIF-001"
overlay_text = "Fake Camera 01"
codec = "h264_nvenc"   # GPU encode (NVENC session limit applies)
preset = "p2"

